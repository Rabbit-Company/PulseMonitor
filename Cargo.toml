[package]
name = "pulsemonitor"
version = "3.16.0"
authors = ["Rabbit Company LLC <info@rabbit-company.com>"]
description = "Simple pulse monitor"
edition = "2024"
repository = "https://github.com/Rabbit-Company/PulseMonitor"
license = "GPL-3.0"
readme = "README.md"
rust-version = "1.99.0"
categories = ["command-line-utilities"]
keywords = ["cli", "process-monitoring"]
publish = ["pulsemonitor"]

[dependencies]

# Core and Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# CLI and UI
clap = { version = "4.6", features = ["derive"] }

# Async runtime and utilities
tokio = { version = "1.53", features = ["full"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["compat"] }

# Config and Serialization
toml = "1.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Environment variables
dotenvy = "0.15"

# HTTP
reqwest = { version = "0.13", default-features = false, features = [
	"rustls",
	"hickory-dns"
] }

# DNS
hickory-proto = { version = "0.26", default-features = false }

# WebSocket
tokio-tungstenite = { version = "0.30", default-features = false, features = [
	"connect",
	"rustls-tls-webpki-roots",
] }

# SMTP
lettre = { version = "0.11", default-features = false, features = [
	"smtp-transport",
	"ring",
	"webpki-roots",
	"tokio1-rustls",
] }

# IMAP
imap = { version = "3.0.0-alpha.15", default-features = false, features = [
	"rustls-tls",
] }

# Redis
redis = { version = "1.7", default-features = false, features = [
	"tokio-rustls-comp",
	"tls-rustls-webpki-roots",
] }

# MySQL
mysql_async = { version = "0.37", default-features = false, features = [
	"minimal",
	"rustls-tls",
] }

# PostgreSQL
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.14"

# MSSQL
tiberius = { version = "0.13", default-features = false, features = [
	"tokio",
	"rustls",
] }

# Minecraft
elytra-ping = { version = "6.0" }

# Game servers
gamedig = { version = "0.9", default-features = false, features = [
	"games",
	"game_defs",
] }

# SNMP
snmp2 = { version = "0.5", features = ["v3", "tokio"] }

rustls = { version = "0.23", default-features = false, features = ["ring"] }
chrono = "0.4"
uuid = { version = "1.27", features = ["v4"] }
